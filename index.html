<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нормативная база — Техэксперт</title>
    <style>
        /* ============================================
           RESET & BASE
           ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #007aff;
            --blue-hover: #0066d9;
            --gray-50: #f5f5f7;
            --gray-100: #e8e8ed;
            --gray-200: #d1d1d6;
            --gray-300: #aeaeb2;
            --gray-400: #8e8e93;
            --gray-500: #636366;
            --gray-600: #48484a;
            --gray-700: #2c2c2e;
            --gray-800: #1c1c1e;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.5;
        }

        /* ============================================
           HEADER
           ============================================ */
        .app-header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: var(--blue);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--gray-800);
        }

        .brand .sub {
            font-size: 13px;
            color: var(--gray-400);
            display: block;
            margin-top: -2px;
        }

        .header-stats {
            font-size: 13px;
            color: var(--gray-400);
            background: var(--gray-100);
            padding: 6px 16px;
            border-radius: 20px;
        }

        /* ============================================
           MAIN LAYOUT
           ============================================ */
        .app-main {
            padding: 24px 0 40px;
        }

        /* ============================================
           SEARCH SECTION
           ============================================ */
        .search-section {
            margin-bottom: 24px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1.5px solid transparent;
            transition: all 0.2s;
        }

        .search-wrapper:focus-within {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.12), var(--shadow);
        }

        .search-wrapper .icon {
            padding: 0 12px 0 16px;
            font-size: 18px;
            color: var(--gray-300);
        }

        .search-wrapper input {
            flex: 1;
            padding: 14px 16px 14px 0;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font);
            color: var(--gray-800);
        }

        .search-wrapper input::placeholder {
            color: var(--gray-300);
        }

        .search-wrapper .clear-btn {
            background: none;
            border: none;
            padding: 0 16px;
            font-size: 18px;
            color: var(--gray-300);
            cursor: pointer;
            display: none;
        }

        .search-wrapper .clear-btn.visible {
            display: block;
        }

        /* ============================================
           FILTERS
           ============================================ */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 6px 18px;
            border: 1.5px solid var(--gray-200);
            border-radius: 20px;
            background: #fff;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-500);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
        }

        .filter-btn:hover {
            border-color: var(--gray-300);
            color: var(--gray-700);
        }

        .filter-btn.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }

        /* ============================================
           RESULTS INFO
           ============================================ */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--gray-400);
        }

        .results-info strong {
            color: var(--gray-700);
        }

        /* ============================================
           DOCUMENTS GRID
           ============================================ */
        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .document-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.02);
            cursor: pointer;
        }

        .document-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 122, 255, 0.1);
        }

        .doc-type-badge {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 2px 12px;
            border-radius: 12px;
            background: var(--gray-100);
            color: var(--gray-500);
            display: inline-block;
            margin-bottom: 8px;
        }

        .doc-type-badge.ГОСТ {
            background: #e3f0ff;
            color: #0051a8;
        }

        .doc-type-badge.СП {
            background: #e8f5e9;
            color: #1e7a3a;
        }

        .doc-type-badge.СНиП {
            background: #fff3e0;
            color: #b45a0e;
        }

        .doc-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 2px;
        }

        .doc-fullname {
            font-size: 13px;
            color: var(--gray-400);
            margin-bottom: 12px;
        }

        .doc-meta {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--gray-300);
        }

        /* ============================================
           SEARCH RESULTS
           ============================================ */
        #searchResults {
            display: none;
            margin-bottom: 24px;
        }

        .search-result-item {
            background: #fff;
            padding: 14px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-result-item:hover {
            border-color: var(--blue);
            box-shadow: var(--shadow);
        }

        .search-result-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--gray-800);
            margin-bottom: 2px;
        }

        .search-result-context {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.6;
        }

        .search-result-context mark {
            background: #ffd60a;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* ============================================
           EMPTY / LOADING
           ============================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .empty-state .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--gray-600);
            margin-bottom: 4px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray-200);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================
           PDF VIEWER (FULLSCREEN MODE)
           ============================================ */
        .pdf-viewer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #1c1c1e;
            z-index: 1000;
            flex-direction: column;
        }

        .pdf-viewer-overlay.active {
            display: flex;
        }

        .pdf-viewer-toolbar {
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(16px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
            min-height: 60px;
        }

        .pdf-viewer-toolbar .left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .pdf-viewer-toolbar .doc-title {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .pdf-viewer-toolbar .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .pdf-viewer-toolbar .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .pdf-viewer-toolbar .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pdf-viewer-toolbar .controls button {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
        }

        .pdf-viewer-toolbar .controls button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        .pdf-viewer-toolbar .controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pdf-viewer-toolbar .controls .page-info {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            min-width: 80px;
            text-align: center;
        }

        .pdf-viewer-toolbar .controls .zoom-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pdf-viewer-toolbar .controls .zoom-group span {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            min-width: 44px;
            text-align: center;
        }

        /* PDF Search inside viewer */
        .pdf-viewer-toolbar .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.2s;
        }

        .pdf-viewer-toolbar .search-box:focus-within {
            border-color: var(--blue);
        }

        .pdf-viewer-toolbar .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 6px 10px;
            font-size: 13px;
            font-family: var(--font);
            width: 140px;
        }

        .pdf-viewer-toolbar .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .pdf-viewer-toolbar .search-box .search-icon {
            padding: 0 6px 0 10px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .pdf-viewer-toolbar .search-box .search-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            padding-right: 4px;
        }

        .pdf-viewer-toolbar .search-box .search-nav button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .pdf-viewer-toolbar .search-box .search-nav button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .pdf-viewer-toolbar .search-box .search-nav button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .pdf-viewer-toolbar .search-box .search-count {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            padding-right: 6px;
            min-width: 36px;
            text-align: center;
        }

        .pdf-viewer-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #1c1c1e;
        }

        .pdf-viewer-body canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
            background: #fff;
        }

        .pdf-viewer-body .pdf-error {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 60px 20px;
        }

        .pdf-viewer-body .pdf-error .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .pdf-viewer-body .pdf-error h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .pdf-viewer-body .pdf-error p {
            font-size: 14px;
            max-width: 500px;
            margin: 0 auto;
            word-break: break-word;
        }

        /* ============================================
           SEARCH RESULTS LIST inside viewer
           ============================================ */
        .pdf-search-results {
            position: fixed;
            right: 20px;
            top: 80px;
            bottom: 20px;
            width: 320px;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            display: none;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            z-index: 1001;
        }

        .pdf-search-results.active {
            display: flex;
        }

        .pdf-search-results .header {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .pdf-search-results .header h4 {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        .pdf-search-results .header .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            cursor: pointer;
        }

        .pdf-search-results .header .close-btn:hover {
            color: #fff;
        }

        .pdf-search-results .list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .pdf-search-results .list .item {
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .pdf-search-results .list .item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .pdf-search-results .list .item mark {
            background: #ffd60a;
            padding: 1px 3px;
            border-radius: 2px;
            color: #1c1c1e;
            font-weight: 600;
        }

        .pdf-search-results .list .item .page-label {
            display: block;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
        }

        .pdf-search-results .list .empty {
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .pdf-viewer-toolbar {
                padding: 10px 14px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .pdf-viewer-toolbar .left .doc-title {
                max-width: 150px;
                font-size: 14px;
            }

            .pdf-viewer-toolbar .controls {
                justify-content: center;
            }

            .pdf-viewer-toolbar .search-box input {
                width: 100px;
            }

            .pdf-search-results {
                right: 10px;
                left: 10px;
                width: auto;
                top: 120px;
                bottom: 10px;
            }

            .documents-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }
            .pdf-viewer-toolbar .controls {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            .pdf-viewer-toolbar .search-box input {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon">📘</div>
                    <div>
                        <h1>Нормативная база</h1>
                        <span class="sub">СП · ГОСТ · СНиП — автомобильные дороги</span>
                    </div>
                </div>
                <div class="header-stats" id="headerStats">Загрузка…</div>
            </div>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="app-main">
        <div class="container">

            <!-- Status -->
            <div id="statusBox"></div>

            <!-- Search -->
            <section class="search-section">
                <div class="search-wrapper">
                    <span class="icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Поиск по всем документам…" autocomplete="off" />
                    <button class="clear-btn" id="clearBtn">✕</button>
                </div>
            </section>

            <!-- Filters -->
            <div class="filters" id="filterContainer">
                <button class="filter-btn active" data-type="all">Все</button>
                <button class="filter-btn" data-type="СП">СП</button>
                <button class="filter-btn" data-type="ГОСТ">ГОСТ</button>
                <button class="filter-btn" data-type="СНиП">СНиП</button>
            </div>

            <!-- Results info -->
            <div class="results-info">
                <span id="statsText">Загрузка документов…</span>
                <span id="resultCount" style="display:none;"></span>
            </div>

            <!-- Search results -->
            <div id="searchResults"></div>

            <!-- Documents grid -->
            <div id="documentsList" class="documents-grid"></div>

            <!-- Empty state -->
            <div id="emptyState" class="empty-state" style="display:none;">
                <span class="big-icon">📭</span>
                <h3>Нет документов</h3>
                <p>Попробуйте изменить фильтр</p>
            </div>

            <!-- Loading state -->
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Загрузка и обработка документов…</p>
            </div>

        </div>
    </main>

    <!-- ========== PDF VIEWER (FULLSCREEN) ========== -->
    <div class="pdf-viewer-overlay" id="pdfViewer">
        <!-- Toolbar -->
        <div class="pdf-viewer-toolbar">
            <div class="left">
                <button class="close-btn" id="pdfCloseBtn">✕</button>
                <span class="doc-title" id="pdfDocTitle">Документ</span>
            </div>
            <div class="controls">
                <button id="pdfPrevBtn">← Пред.</button>
                <span class="page-info" id="pdfPageInfo">1 / 1</span>
                <button id="pdfNextBtn">След. →</button>
                <div class="zoom-group">
                    <button id="pdfZoomOut">−</button>
                    <span id="pdfZoomInfo">100%</span>
                    <button id="pdfZoomIn">+</button>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="pdfSearchInput" placeholder="Поиск в документе…" />
                    <span class="search-count" id="pdfSearchCount">0/0</span>
                    <div class="search-nav">
                        <button id="pdfSearchPrev" title="Предыдущее">▲</button>
                        <button id="pdfSearchNext" title="Следующее">▼</button>
                        <button id="pdfSearchToggle" title="Список результатов">☰</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="pdf-viewer-body" id="pdfViewerBody">
            <canvas id="pdfCanvas"></canvas>
            <div id="pdfError" class="pdf-error" style="display:none;">
                <span class="big-icon">⚠️</span>
                <h3>Не удалось загрузить PDF</h3>
                <p id="pdfErrorMsg">Файл не найден или недоступен.</p>
            </div>
        </div>
    </div>

    <!-- ========== PDF SEARCH RESULTS SIDEBAR ========== -->
    <div class="pdf-search-results" id="pdfSearchResults">
        <div class="header">
            <h4>Результаты поиска</h4>
            <button class="close-btn" id="pdfSearchResultsClose">✕</button>
        </div>
        <div class="list" id="pdfSearchResultsList"></div>
    </div>

    <!-- ========== PDF.js ========== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const DOCUMENTS = [{
            id: 'sp-34-13330-2021',
            title: 'СП 34.13330.2021',
            fullName: 'СНиП 2.05.02-85 Автомобильные дороги (с Изменением № 1)',
            type: 'СП',
            year: 2021,
            url: 'documents/sp-34-13330-2021.pdf'
        }, {
            id: 'gost-33475-2015',
            title: 'ГОСТ 33475-2015',

        // ============================================================
        //  STATE
        // ============================================================
        let documents = [];
        let searchEngine = null;
        let currentFilter = 'all';

        // PDF viewer state
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let currentScale = 1.4;
        let currentPdfUrl = '';
        let currentPdfText = '';
        let currentPdfTitle = '';

        // PDF search state
        let pdfSearchResults = [];
        let pdfSearchIndex = -1;

        // ============================================================
        //  INIT PDF.JS
        // ============================================================
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const searchInput = $('#searchInput');
        const clearBtn = $('#clearBtn');
        const filterContainer = $('#filterContainer');
        const statsText = $('#statsText');
        const resultCount = $('#resultCount');
        const searchResults = $('#searchResults');
        const documentsList = $('#documentsList');
        const emptyState = $('#emptyState');
        const loadingState = $('#loadingState');
        const statusBox = $('#statusBox');
        const headerStats = $('#headerStats');

        // PDF viewer
        const pdfViewer = $('#pdfViewer');
        const pdfDocTitle = $('#pdfDocTitle');
        const pdfCloseBtn = $('#pdfCloseBtn');
        const pdfPrevBtn = $('#pdfPrevBtn');
        const pdfNextBtn = $('#pdfNextBtn');
        const pdfZoomOut = $('#pdfZoomOut');
        const pdfZoomIn = $('#pdfZoomIn');
        const pdfPageInfo = $('#pdfPageInfo');
        const pdfZoomInfo = $('#pdfZoomInfo');
        const pdfCanvas = $('#pdfCanvas');
        const pdfError = $('#pdfError');
        const pdfErrorMsg = $('#pdfErrorMsg');
        const pdfViewerBody = $('#pdfViewerBody');

        // PDF search
        const pdfSearchInput = $('#pdfSearchInput');
        const pdfSearchCount = $('#pdfSearchCount');
        const pdfSearchPrev = $('#pdfSearchPrev');
        const pdfSearchNext = $('#pdfSearchNext');
        const pdfSearchToggle = $('#pdfSearchToggle');
        const pdfSearchResultsPanel = $('#pdfSearchResults');
        const pdfSearchResultsList = $('#pdfSearchResultsList');
        const pdfSearchResultsClose = $('#pdfSearchResultsClose');

        // ============================================================
        //  SEARCH ENGINE
        // ============================================================
        class SimpleSearch {
            constructor() { this.index = []; }
            add(doc) {
                this.index.push({
                    id: doc.id,
                    title: (doc.title + ' ' + doc.fullName).toLowerCase(),
                    text: doc.text.toLowerCase(),
                    original: doc
                });
            }
            search(query) {
                if (!query || query.length < 2) return [];
                const words = query.toLowerCase().trim().split(/\s+/).filter(w => w.length > 0);
                const results = [];
                for (const entry of this.index) {
                    let score = 0,
                        found = false;
                    for (const word of words) {
                        if (entry.title.includes(word)) { score += 12;
                            found = true; }
                        const matches = (entry.text.match(new RegExp(word, 'g')) || []).length;
                        if (matches > 0) { score += matches;
                            found = true; }
                    }
                    if (found) results.push({ ref: entry.original.id, score, doc: entry.original });
                }
                results.sort((a, b) => b.score - a.score);
                return results;
            }
        }

        // ============================================================
        //  EXTRACT TEXT FROM PDF
        // ============================================================
        async function extractTextFromPDF(url) {
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const text = content.items.map(item => item.str).join(' ');
                    fullText += text + '\f';
                }
                return fullText;
            } catch (err) {
                console.warn('extractTextFromPDF error:', err.message);
                return '';
            }
        }

        // ============================================================
        //  PROCESS DOCUMENTS
        // ============================================================
        async function processAllDocuments() {
            documents = [];
            let processed = 0;
            const total = DOCUMENTS.length;

            for (const doc of DOCUMENTS) {
                try {
                    const text = await extractTextFromPDF(doc.url);
                    const pages = text.split('\f').filter(p => p.trim()).length || 0;
                    documents.push({ ...doc, text, pages });
                    processed++;
                } catch (err) {
                    console.warn(`⚠️ ${doc.title}:`, err.message);
                    documents.push({ ...doc, text: '', pages: 0, error: err.message });
                    processed++;
                }
                headerStats.textContent = `Обработка… ${processed}/${total}`;
            }

            searchEngine = new SimpleSearch();
            documents.forEach(d => searchEngine.add(d));

            headerStats.textContent = `${documents.length} документов`;
            updateStats();
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function updateStats() {
            const total = documents.length;
            const withText = documents.filter(d => d.text && d.text.length > 0).length;
            const chars = documents.reduce((sum, d) => sum + (d.text ? d.text.length : 0), 0);
            statsText.textContent = `Всего: ${total} | С текстом: ${withText} | Символов: ${chars.toLocaleString()}`;
            headerStats.textContent = `${total} документов`;
        }

        function renderDocuments() {
            const filtered = documents.filter(d => currentFilter === 'all' || d.type === currentFilter);

            if (filtered.length === 0) {
                documentsList.style.display = 'none';
                emptyState.style.display = 'block';
                searchResults.style.display = 'none';
                resultCount.style.display = 'none';
                return;
            }

            documentsList.style.display = 'grid';
            emptyState.style.display = 'none';
            resultCount.style.display = 'none';

            documentsList.innerHTML = filtered.map(doc => `
                    <div class="document-card" data-url="${doc.url}" data-title="${doc.title.replace(/'/g, "\\'")}">
                        <span class="doc-type-badge ${doc.type}">${doc.type}</span>
                        <div class="doc-title">${doc.title}</div>
                        <div class="doc-fullname">${doc.fullName}</div>
                        <div class="doc-meta">
                            <span>📅 ${doc.year}</span>
                            <span>📄 ${doc.pages || '?'} стр.</span>
                        </div>
                    </div>
                `).join('');

            documentsList.querySelectorAll('.document-card').forEach(el => {
                el.addEventListener('click', () => {
                    const url = el.dataset.url;
                    const title = el.dataset.title;
                    openPDF(url, title);
                });
            });
        }

        // ============================================================
        //  SEARCH HANDLER
        // ============================================================
        function handleSearch() {
            const query = searchInput.value.trim();
            clearBtn.classList.toggle('visible', query.length > 0);

            if (!query || query.length < 2) {
                searchResults.style.display = 'none';
                documentsList.style.display = 'grid';
                resultCount.style.display = 'none';
                renderDocuments();
                return;
            }

            if (!searchEngine) return;
            const results = searchEngine.search(query);
            displaySearchResults(results, query);
        }

        function displaySearchResults(results, query) {
            let filtered = results;
            if (currentFilter !== 'all') {
                filtered = results.filter(r => r.doc.type === currentFilter);
            }

            if (filtered.length === 0) {
                searchResults.innerHTML = `
                        <div class="empty-state">
                            <span class="big-icon">🔍</span>
                            <h3>Ничего не найдено</h3>
                            <p>Попробуйте изменить запрос</p>
                        </div>
                    `;
                searchResults.style.display = 'block';
                documentsList.style.display = 'none';
                resultCount.style.display = 'block';
                resultCount.textContent = '0 результатов';
                return;
            }

            const html = filtered.map(r => {
                const doc = r.doc;
                const context = getContext(doc.text, query);
                return `
                        <div class="search-result-item" data-url="${doc.url}" data-title="${doc.title.replace(/'/g, "\\'")}">
                            <div class="search-result-title">${doc.title}</div>
                            <div class="search-result-context">${context}</div>
                            <div style="font-size:12px;color:var(--gray-300);margin-top:4px;">${doc.fullName}</div>
                        </div>
                    `;
            }).join('');

            searchResults.innerHTML = `
                    <div style="margin-bottom:10px;font-size:14px;color:var(--gray-400);">
                        Найдено: <strong style="color:var(--gray-700);">${filtered.length}</strong>
                        ${currentFilter !== 'all' ? `в категории «${currentFilter}»` : ''}
                    </div>
                    ${html}
                `;

            searchResults.style.display = 'block';
            documentsList.style.display = 'none';
            resultCount.style.display = 'block';
            resultCount.textContent = `${filtered.length} результатов`;

            searchResults.querySelectorAll('.search-result-item').forEach(el => {
                el.addEventListener('click', () => {
                    openPDF(el.dataset.url, el.dataset.title);
                });
            });
        }

        function getContext(text, query) {
            if (!text) return '⚠️ Текст недоступен';
            const lower = text.toLowerCase();
            const q = query.toLowerCase();
            const idx = lower.indexOf(q);
            if (idx === -1) return '…';
            const start = Math.max(0, idx - 55);
            const end = Math.min(text.length, idx + q.length + 55);
            let snippet = text.substring(start, end);
            const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            snippet = snippet.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
            return (start > 0 ? '…' : '') + snippet + (end < text.length ? '…' : '');
        }

        // ============================================================
        //  OPEN PDF VIEWER
        // ============================================================
        async function openPDF(url, title) {
            pdfDocTitle.textContent = title || 'Документ';
            currentPdfTitle = title || 'Документ';
            currentPdfUrl = url;
            pdfError.style.display = 'none';
            pdfCanvas.style.display = 'block';
            pdfViewer.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Clear previous search
            pdfSearchInput.value = '';
            pdfSearchResults = [];
            pdfSearchIndex = -1;
            pdfSearchCount.textContent = '0/0';
            pdfSearchResultsPanel.classList.remove('active');

            try {
                pdfDoc = await pdfjsLib.getDocument(url).promise;
                totalPages = pdfDoc.numPages;
                currentPage = 1;
                currentScale = 1.4;

                // Extract full text for searching
                let fullText = '';
                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const content = await page.getTextContent();
                    const text = content.items.map(item => item.str).join(' ');
                    fullText += text + '\f';
                }
                currentPdfText = fullText;

                renderPDFPage();
            } catch (err) {
                console.error('PDF load error:', err);
                pdfCanvas.style.display = 'none';
                pdfError.style.display = 'block';
                pdfErrorMsg.textContent = `Не удалось загрузить PDF: ${err.message || 'файл не найден'}`;
                pdfDoc = null;
                currentPdfText = '';
            }
        }

        // ============================================================
        //  RENDER PDF PAGE
        // ============================================================
        async function renderPDFPage() {
            if (!pdfDoc) return;
            try {
                const page = await pdfDoc.getPage(currentPage);
                const viewport = page.getViewport({ scale: currentScale });
                pdfCanvas.height = viewport.height;
                pdfCanvas.width = viewport.width;
                const ctx = pdfCanvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;

                pdfPageInfo.textContent = `${currentPage} / ${totalPages}`;
                pdfZoomInfo.textContent = Math.round(currentScale * 100) + '%';
                pdfPrevBtn.disabled = currentPage === 1;
                pdfNextBtn.disabled = currentPage === totalPages;

                // If we have search results, highlight matches on the page
                // (simplified: we just re-render without highlights for performance)
                // Highlights are shown in the sidebar list
            } catch (err) {
                console.warn('renderPDFPage error:', err);
            }
        }

        // ============================================================
        //  PDF NAVIGATION
        // ============================================================
        function pdfPrevPage() { if (currentPage > 1) { currentPage--;
                renderPDFPage(); } }

        function pdfNextPage() { if (currentPage < totalPages) { currentPage++;
                renderPDFPage(); } }

        function pdfChangeZoom(delta) {
            currentScale = Math.max(0.4, Math.min(3.0, currentScale + delta));
            renderPDFPage();
        }

        function closePDFViewer() {
            pdfViewer.classList.remove('active');
            document.body.style.overflow = '';
            pdfDoc = null;
            pdfSearchResultsPanel.classList.remove('active');
        }

        // ============================================================
        //  PDF SEARCH
        // ============================================================
        function pdfSearchInDocument() {
            const query = pdfSearchInput.value.trim();
            if (!query || query.length < 2 || !currentPdfText) {
                pdfSearchResults = [];
                pdfSearchIndex = -1;
                pdfSearchCount.textContent = '0/0';
                pdfSearchResultsPanel.classList.remove('active');
                return;
            }

            const q = query.toLowerCase();
            const pages = currentPdfText.split('\f');
            const results = [];

            pages.forEach((pageText, idx) => {
                const pageNum = idx + 1;
                const lower = pageText.toLowerCase();
                let pos = lower.indexOf(q);
                while (pos !== -1) {
                    const start = Math.max(0, pos - 40);
                    const end = Math.min(pageText.length, pos + q.length + 40);
                    let snippet = pageText.substring(start, end);
                    snippet = snippet.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'),
                        m => `<mark>${m}</mark>`);
                    results.push({
                        page: pageNum,
                        snippet: (start > 0 ? '…' : '') + snippet + (end < pageText.length ? '…' : ''),
                        position: pos
                    });
                    pos = lower.indexOf(q, pos + 1);
                }
            });

            pdfSearchResults = results;
            pdfSearchIndex = results.length > 0 ? 0 : -1;
            pdfSearchCount.textContent = results.length > 0 ? `1/${results.length}` : '0/0';

            // Update sidebar
            if (results.length > 0) {
                pdfSearchResultsList.innerHTML = results.map((r, i) => `
                        <div class="item" data-index="${i}">
                            ${r.snippet}
                            <span class="page-label">Страница ${r.page}</span>
                        </div>
                    `).join('');

                pdfSearchResultsList.querySelectorAll('.item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.dataset.index);
                        goToPDFSearchResult(idx);
                    });
                });

                pdfSearchResultsPanel.classList.add('active');
                // Go to first result
                goToPDFSearchResult(0);
            } else {
                pdfSearchResultsPanel.classList.remove('active');
                pdfSearchResultsList.innerHTML = '<div class="empty">Ничего не найдено</div>';
                pdfSearchResultsPanel.classList.add('active');
            }
        }

        function goToPDFSearchResult(index) {
            if (index < 0 || index >= pdfSearchResults.length) return;
            pdfSearchIndex = index;
            const result = pdfSearchResults[index];
            currentPage = result.page;
            pdfSearchCount.textContent = `${index + 1}/${pdfSearchResults.length}`;
            renderPDFPage();

            // Highlight the selected item in the list
            pdfSearchResultsList.querySelectorAll('.item').forEach((el, i) => {
                el.style.background = i === index ? 'rgba(0, 122, 255, 0.2)' : 'rgba(255,255,255,0.04)';
            });
        }

        function pdfSearchPrevResult() {
            if (pdfSearchResults.length === 0) return;
            const newIdx = pdfSearchIndex > 0 ? pdfSearchIndex - 1 : pdfSearchResults.length - 1;
            goToPDFSearchResult(newIdx);
        }

        function pdfSearchNextResult() {
            if (pdfSearchResults.length === 0) return;
            const newIdx = pdfSearchIndex < pdfSearchResults.length - 1 ? pdfSearchIndex + 1 : 0;
            goToPDFSearchResult(newIdx);
        }

        function toggleSearchResults() {
            if (pdfSearchResults.length === 0) return;
            pdfSearchResultsPanel.classList.toggle('active');
        }

        // ============================================================
        //  STATUS
        // ============================================================
        function showStatus(type, message) {
            const icons = { success: '✅', error: '⚠️', info: 'ℹ️' };
            statusBox.innerHTML = `
                    <div style="padding:12px 18px;border-radius:10px;background:${type === 'error' ? '#fde8e8' : '#e8f5e9'};color:${type === 'error' ? '#b71c1c' : '#1e7a3a'};font-size:14px;">
                        ${icons[type] || 'ℹ️'} ${message}
                    </div>
                `;
            if (type === 'success' || type === 'info') {
                setTimeout(() => { statusBox.innerHTML = ''; }, 5000);
            }
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        function setupEvents() {
            // Main search
            searchInput.addEventListener('input', debounce(handleSearch, 250));
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.remove('visible');
                handleSearch();
                searchInput.focus();
            });

            // Filters
            filterContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                filterContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.type;
                if (searchInput.value.trim().length >= 2) {
                    handleSearch();
                } else {
                    renderDocuments();
                }
            });

            // PDF viewer controls
            pdfCloseBtn.addEventListener('click', closePDFViewer);
            pdfPrevBtn.addEventListener('click', pdfPrevPage);
            pdfNextBtn.addEventListener('click', pdfNextPage);
            pdfZoomOut.addEventListener('click', () => pdfChangeZoom(-0.15));
            pdfZoomIn.addEventListener('click', () => pdfChangeZoom(0.15));

            // PDF search
            pdfSearchInput.addEventListener('input', debounce(pdfSearchInDocument, 300));
            pdfSearchPrev.addEventListener('click', pdfSearchPrevResult);
            pdfSearchNext.addEventListener('click', pdfSearchNextResult);
            pdfSearchToggle.addEventListener('click', toggleSearchResults);
            pdfSearchResultsClose.addEventListener('click', () => pdfSearchResultsPanel.classList.remove('active'));

            // Keyboard shortcuts in viewer
            document.addEventListener('keydown', (e) => {
                if (!pdfViewer.classList.contains('active')) return;
                if (e.key === 'Escape') closePDFViewer();
                if (e.key === 'ArrowLeft') pdfPrevPage();
                if (e.key === 'ArrowRight') pdfNextPage();
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    pdfSearchInput.focus();
                    pdfSearchInput.select();
                }
            });

            // Close on backdrop click
            pdfViewer.addEventListener('click', (e) => {
                if (e.target === pdfViewer || e.target === pdfViewerBody) {
                    closePDFViewer();
                }
            });
        }

        // ============================================================
        //  DEBOUNCE
        // ============================================================
        function debounce(fn, ms) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), ms);
            };
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof pdfjsLib === 'undefined') {
                showStatus('error', 'PDF.js не загружен. Проверьте интернет.');
                loadingState.style.display = 'none';
                return;
            }

            try {
                loadingState.style.display = 'block';
                documentsList.style.display = 'none';

                await processAllDocuments();

                loadingState.style.display = 'none';
                documentsList.style.display = 'grid';
                renderDocuments();
                setupEvents();

                const withText = documents.filter(d => d.text && d.text.length > 0).length;
                if (withText === 0) {
                    showStatus('info', '📄 Текст не извлечён. Убедитесь, что PDF-файлы лежат в папке <strong>documents/</strong>.');
                } else {
                    showStatus('success', `✅ Загружено ${documents.length} документов. Поиск готов.`);
                }

            } catch (err) {
                console.error(err);
                showStatus('error', 'Ошибка: ' + err.message);
                loadingState.style.display = 'none';
            }
        });
    </script>
